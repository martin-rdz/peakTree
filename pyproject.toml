
[build-system]
requires = ["setuptools>=61.0", "wheel", 
            ]
build-backend = "setuptools.build_meta"

[project]
name = "peakTree"
dynamic = ["version"]
authors = [
  { name="M. Radenz" }, { name="T. Vogl" },
]
description=''
requires-python = ">=3.8"
license = {text = "MIT License"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy==2.1",
  "matplotlib",
  "xarray",
  "netCDF4",
  "numba",
  "pandas",
  "loess",
  "toml",
  "rpgpy",
  "cmcrameri",
]

readme = "README.md"
#readme = {file = ["README.md"]}
[tool.setuptools.packages]
find = {}

[tool.setuptools.dynamic]
version = {attr = "peakTree._meta.__version__"}  # any module attribute compatible with ast.literal_eval

#license = { file = "LICENSE" }

[project.urls]
Homepage = "https://github.com/martin-rdz/peakTree"